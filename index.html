<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LifePath</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1b;color:#f4f5ff;font:15px system-ui,-apple-system,sans-serif}header{padding:22px 18px;background:linear-gradient(120deg,#171735,#321353);position:sticky;top:0;z-index:2}h1{margin:0;font-size:29px}small,.muted{color:#b7b9d0}main{max-width:700px;margin:auto;padding:14px 14px 95px}.card{background:#151d32;border:1px solid #303750;border-radius:17px;padding:16px;margin-bottom:12px}h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:9px 0}.bar{height:9px;border-radius:9px;background:#303950;margin-top:5px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#19d3b2)}button,input,select{font:inherit}button{background:#273252;color:white;border:1px solid #465076;border-radius:12px;padding:12px;cursor:pointer;min-height:45px}button:active{transform:scale(.98)}button.primary{background:linear-gradient(110deg,#7b36e8,#ae39e5);border:0;font-weight:750}button:disabled{opacity:.45}.wide{width:100%}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pill{background:#232d47;padding:6px 10px;border-radius:10px;display:inline-block;margin:3px 2px}input,select{width:100%;padding:12px;background:#0b1428;color:white;border:1px solid #536079;border-radius:10px;margin:5px 0 12px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #28324b}.row:last-child{border:0}#toast{position:fixed;bottom:18px;left:16px;right:16px;background:#3d2469;border:1px solid #af78ed;padding:14px;border-radius:14px;display:none;z-index:10}#log{max-height:240px;overflow:auto}.event{background:#29213f;border-radius:12px;padding:13px;margin-top:10px}.event button{display:block;width:100%;margin-top:8px;text-align:left}nav{position:fixed;bottom:0;left:0;right:0;background:#11172a;border-top:1px solid #38405d;display:flex;justify-content:space-around;padding:8px 4px max(9px,env(safe-area-inset-bottom))}nav button{font-size:12px;padding:9px 6px;border:0;background:none}nav button.active{color:#cf9bff}section[hidden]{display:none} .gold{color:#ffd166}</style></head><body><header><h1>✦ Life<span style="color:#bf80ff">Path</span></h1><small>REALISTIC LIFE SIMULATOR · SAVES ON THIS DEVICE</small></header><main><div id="setup" class="card" hidden><h2>👤 Create Your Life</h2><label>Your name<input id="name" maxlength="28" placeholder="Your character's name"></label><label>Starting age<select id="startAge"><option value="18">18 — Young adult</option><option value="16">16 — Teen</option><option value="21">21 — Adult</option><option value="0">0 — Newborn</option></select></label><button class="primary wide" onclick="start()">Begin My Life</button></div><div id="game" hidden><div class="card"><div class="row"><strong id="who"></strong><span id="age"></span></div><div class="row"><span id="job"></span><strong class="gold" id="balance"></strong></div><div id="event"></div><button class="primary wide" style="margin-top:12px" onclick="ageUp()">🎂 Age Up One Year</button></div><section id="home"><div class="card"><h2>❤️ Life Statistics</h2><div class="grid" id="stats"></div></div><div class="card"><h2>💵 Financial Overview</h2><div id="finance"></div></div><div class="card"><h2>🎯 Quick Actions</h2><div class="actions"><button onclick="doAction('study')">📚 Study</button><button onclick="doAction('exercise')">🏃 Exercise</button><button onclick="doAction('socialize')">💕 Socialize</button><button onclick="doAction('work')">💼 Work Shift</button><button onclick="doAction('rest')">🛌 Rest</button><button onclick="doAction('side')">💻 Side Hustle</button></div></div></section><section id="career" hidden><div class="card"><h2>💼 Careers & Education</h2><div id="careerInfo"></div><div class="actions"><button onclick="apply('Retail Associate',28000,16)">Retail Associate</button><button onclick="apply('Office Assistant',39000,18)">Office Assistant</button><button onclick="apply('Software Developer',85000,21,75)">Software Developer</button><button onclick="apply('Manager',62000,23,65)">Manager</button><button onclick="doAction('college')">🎓 Attend College ($12k)</button><button onclick="doAction('quit')">Quit Job</button></div></div></section><section id="social" hidden><div class="card"><h2>💕 Relationships</h2><div id="socialInfo"></div><div class="actions"><button onclick="doAction('date')">Go on Date ($80)</button><button onclick="doAction('friend')">Make a Friend</button><button onclick="doAction('marry')">Get Married ($3k)</button><button onclick="doAction('child')">Have a Child</button></div></div></section><section id="lifestyle" hidden><div class="card"><h2>🏠 Lifestyle & Money</h2><div id="lifeInfo"></div><div class="actions"><button onclick="buy('Used Car',6500)">🚗 Used Car ($6.5k)</button><button onclick="buy('Apartment',65000)">🏢 Apartment ($65k)</button><button onclick="buy('House',220000)">🏡 House ($220k)</button><button onclick="doAction('invest')">📈 Invest $1,000</button><button onclick="doAction('business')">🏢 Start Business ($15k)</button><button onclick="doAction('travel')">✈️ Vacation ($2k)</button></div></div></section><section id="history" hidden><div class="card"><h2>📜 Your Life Story</h2><div id="log"></div></div><div class="card"><button onclick="exportSave()">⬇️ Export Save</button> <button onclick="reset()">🔄 New Life</button></div></section></div></main><nav id="nav" hidden><button onclick="tab('home')" id="navhome">🏠<br>Home</button><button onclick="tab('career')" id="navcareer">💼<br>Career</button><button onclick="tab('social')" id="navsocial">💕<br>People</button><button onclick="tab('lifestyle')" id="navlifestyle">💰<br>Life</button><button onclick="tab('history')" id="navhistory">📜<br>Story</button></nav><div id="toast"></div><script>const KEY='lifepath-v2';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}const $=id=>document.getElementById(id);const money=n=>'$'+Math.round(n).toLocaleString();const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const clamp=n=>Math.max(0,Math.min(100,n));function note(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',3500)}function record(t){s.log.unshift('Age '+s.age+': '+t);s.log=s.log.slice(0,120);note(t)}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}render()}function start(){let name=$('name').value.trim()||'Alex';let age=+$('startAge').value;s={name,age,cash:age>=16?1250:0,debt:0,invest:0,job:'Unemployed',salary:0,health:95,happy:75,smart:60,looks:70,energy:85,stress:10,friends:0,partner:false,married:false,children:0,degree:false,items:[],business:false,alive:true,log:['Age '+age+': '+name+' began a new life.']};save()}function render(){if(!s){$('setup').hidden=false;$('game').hidden=true;$('nav').hidden=true;return}$('setup').hidden=true;$('game').hidden=false;$('nav').hidden=false;$('who').textContent='👤 '+s.name;$('age').textContent='Age '+s.age;$('job').textContent='💼 '+s.job;$('balance').textContent=money(s.cash);$('stats').innerHTML=[['❤️ Health',s.health],['😊 Happiness',s.happy],['🧠 Intelligence',s.smart],['✨ Appearance',s.looks],['⚡ Energy',s.energy],['😰 Stress',s.stress]].map(([n,v])=>'<div class="stat">'+n+' <b>'+v+'%</b><div class="bar"><div class="fill" style="width:'+v+'%"></div></div></div>').join('');$('finance').innerHTML=[['Cash',money(s.cash)],['Investments',money(s.invest)],['Debt',money(s.debt)],['Annual salary',money(s.salary)],['Net worth',money(s.cash+s.invest-s.debt+s.items.reduce((a,b)=>a+b.price,0))]].map(([a,b])=>'<div class="row"><span>'+a+'</span><b>'+b+'</b></div>').join('');$('careerInfo').innerHTML='<p>Current job: <b>'+s.job+'</b> · Education: '+(s.degree?'College graduate':'High school / developing skills')+'</p>';$('socialInfo').innerHTML='<p>Friends: '+s.friends+' · Partner: '+(s.partner?'Yes':'No')+' · Married: '+(s.married?'Yes':'No')+' · Children: '+s.children+'</p>';$('lifeInfo').innerHTML='<p>Possessions: '+(s.items.map(x=>x.name).join(', ')||'None')+'</p><p>Business: '+(s.business?'Owner':'None')+'</p>';$('log').innerHTML=s.log.map(x=>'<div class="row">'+escapeText(x)+'</div>').join('');if(!s.alive){$('event').innerHTML='<div class="event">🕯️ Your life has ended. View your story or begin again.</div>'}else if(!s.pending){$('event').innerHTML=''}else{$('event').innerHTML='<div class="event"><b>'+escapeText(s.pending.title)+'</b>'+s.pending.choices.map((x,i)=>'<button onclick="choose('+i+')">'+escapeText(x.label)+'</button>').join('')+'</div>'}}function escapeText(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function ready(){if(!s.alive){note('Start a new life to keep playing.');return false}if(s.pending){note('Choose an event response first.');return false}return true}function ageUp(){if(!ready())return;s.age++;let annual=s.salary+(s.business?rnd(5000,28000):0);let expenses=s.age<18?0:Math.round(annual*.28)+rnd(3500,11000)+s.children*2500;s.cash+=annual-expenses;s.invest=Math.max(0,Math.round(s.invest*(1+rnd(-15,18)/100)));s.health=clamp(s.health-rnd(0,3));s.energy=clamp(s.energy+rnd(-5,8));s.stress=clamp(s.stress+rnd(-8,10));s.happy=clamp(s.happy+rnd(-7,7));record('Birthday! Income '+money(annual)+', annual costs '+money(expenses)+'.');if(s.age>70&&Math.random()<(s.age-65)/120 || s.health===0){s.alive=false;record('Your life ended at age '+s.age+'. Your legacy lives on.');save();return}if(Math.random()<.7){let events=[{title:'A friend invites you to a weekend concert.',choices:[{label:'Go ($120)',cost:120,happy:12,friends:1},{label:'Stay home',energy:10}]},{title:'An unexpected repair bill arrives.',choices:[{label:'Pay $450',cost:450,stress:-8},{label:'Delay payment and take debt',debt:600,stress:12}]},{title:'You find an online training opportunity.',choices:[{label:'Enroll ($350)',cost:350,smart:9},{label:'Skip it',energy:4}]},{title:'Someone offers a risky investment tip.',choices:[{label:'Risk $500',cost:500,gamble:true},{label:'Decline',stress:-3}]}];s.pending=events[rnd(0,events.length-1)]}save()}function choose(i){if(!s.pending)return;let c=s.pending.choices[i];if(c.cost&&s.cash<c.cost){note('Not enough cash for that choice.');return}s.cash-=c.cost||0;s.debt+=c.debt||0;for(let k of ['health','happy','smart','looks','energy','stress'])if(c[k])s[k]=clamp(s[k]+c[k]);s.friends+=c.friends||0;if(c.gamble){let win=Math.random()<.4;s.cash+=win?1500:0;record(win?'Your risky investment paid off!':'Your risky investment lost money.')}else record('You chose: '+c.label);s.pending=null;save()}function apply(job,salary,age,smart=0){if(!ready())return;if(s.age<age||s.smart<smart){note('You do not meet the age or skill requirements.');return}s.job=job;s.salary=salary;s.happy=clamp(s.happy+5);record('Hired as '+job+' with a '+money(salary)+' salary.');save()}function buy(name,price){if(!ready())return;if(s.cash<price){note('Not enough cash.');return}s.cash-=price;s.items.push({name,price});record('Purchased '+name+' for '+money(price)+'.');save()}function doAction(a){if(!ready())return;let cost=0,msg='';switch(a){case'study':s.smart=clamp(s.smart+5);s.energy=clamp(s.energy-10);msg='You studied and improved your skills.';break;case'exercise':s.health=clamp(s.health+5);s.looks=clamp(s.looks+2);s.energy=clamp(s.energy-12);msg='You completed a workout.';break;case'socialize':s.happy=clamp(s.happy+7);s.friends++;cost=30;msg='You spent time with friends.';break;case'work':if(s.age<16){note('Too young to work.');return}s.cash+=s.salary?rnd(100,450):rnd(35,130);s.energy=clamp(s.energy-15);s.stress=clamp(s.stress+5);msg='You worked an extra shift.';break;case'rest':s.energy=clamp(s.energy+22);s.stress=clamp(s.stress-10);msg='You rested and recharged.';break;case'side':if(s.age<13){note('Too young for this activity.');return}s.cash+=rnd(40,210);s.energy=clamp(s.energy-15);msg='Your side hustle brought in extra cash.';break;case'college':if(s.age<18){note('You must be 18.');return}if(s.degree){note('You already have a degree.');return}cost=12000;s.degree=true;s.smart=clamp(s.smart+20);msg='You completed a college program.';break;case'quit':s.job='Unemployed';s.salary=0;msg='You quit your job.';break;case'date':if(s.age<16){note('Too young to date.');return}cost=80;s.partner=true;s.happy=clamp(s.happy+8);msg='You met someone and started dating.';break;case'friend':s.friends++;msg='You made a new friend.';break;case'marry':if(s.age<18||!s.partner){note('You need to be an adult and have a partner.');return}cost=3000;s.married=true;msg='You got married!';break;case'child':if(s.age<18){note('You must be an adult.');return}s.children++;cost=1000;msg='Your family welcomed a child.';break;case'invest':cost=1000;s.invest+=1000;msg='You invested $1,000.';break;case'business':if(s.business){note('You already own a business.');return}cost=15000;s.business=true;msg='You launched a small business.';break;case'travel':cost=2000;s.happy=clamp(s.happy+18);msg='You enjoyed a vacation.';break}if(s.cash<cost){note('Not enough cash.');return}s.cash-=cost;record(msg);save()}function tab(t){for(let id of ['home','career','social','lifestyle','history']){$(id).hidden=id!==t;$('nav'+id).classList.toggle('active',id===t)}window.scrollTo(0,0)}function reset(){if(confirm('Start a new life? Your current save will be replaced.')){s=null;localStorage.removeItem(KEY);render()}}function exportSave(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lifepath-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();tab('home');</script></body></html>
